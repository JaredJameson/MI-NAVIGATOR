# Grafana Datasource Configuration - Prometheus
#
# Auto-provisioned datasource for Grafana
# No manual configuration needed

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: POST
    version: 1
